<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><title>CardProgress — UML state machine</title><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker></defs><text x="640" y="38" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle"><tspan x="640" dy="0">CardProgress: жизненный цикл объекта</tspan></text><rect x="65" y="80" width="1150" height="720" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2" /><text x="640" y="118" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="middle"><tspan x="640" dy="0">Прогресс существует</tspan></text><path d="M65 140 H1215" fill="none" stroke="#334155" stroke-width="2" /><circle cx="135" cy="290" r="10" fill="#0f172a" /><path d="M145 290 H245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="190" y="252" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle"><tspan x="190" dy="0">создание</tspan></text><rect x="245" y="245" width="200" height="90" rx="16" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="345" y="297" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle"><tspan x="345" dy="0">NEW</tspan></text><rect x="835" y="245" width="200" height="90" rx="16" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="935" y="297" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle"><tspan x="935" dy="0">LEARNING</tspan></text><rect x="835" y="555" width="200" height="90" rx="16" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="935" y="607" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle"><tspan x="935" dy="0">REVIEW</tspan></text><rect x="245" y="555" width="200" height="90" rx="16" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="345" y="607" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle"><tspan x="345" dy="0">RELEARNING</tspan></text><path d="M445 290 H835" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="640" y="252" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="640" dy="0">T01: AGAIN · T02: HARD</tspan></text><text x="640" y="277" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="640" dy="0">T03: GOOD [r+1 &lt; n]</tspan></text><path d="M445 325 L835 565" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="690" y="380" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="690" dy="0">T04: EASY или</tspan></text><text x="690" y="406" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="690" dy="0">GOOD [r+1 ≥ n]</tspan></text><path d="M935 335 V555" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="1040" y="430" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="1040" dy="0">T04: EASY /</tspan></text><text x="1040" y="456" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="1040" dy="0">GOOD [r+1 ≥ n]</tspan></text><path d="M880 245 V190 H990 V245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="935" y="176" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle"><tspan x="935" dy="0">T01, T02, T03</tspan></text><path d="M1035 575 H1160 V680 H1035 V630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="1100" y="714" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle"><tspan x="1100" dy="0">T05 / HARD, GOOD, EASY</tspan></text><text x="1100" y="738" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle"><tspan x="1100" dy="0">T07 / AGAIN [m=0]</tspan></text><path d="M835 590 H445" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="640" y="570" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="640" dy="0">T06: AGAIN [m&gt;0]</tspan></text><path d="M445 625 H790 V630 H835" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="640" y="663" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle"><tspan x="640" dy="0">T09: EASY / GOOD [r+1 ≥ m]</tspan></text><text x="640" y="690" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle"><tspan x="640" dy="0">или любая оценка [m=0]</tspan></text><path d="M245 575 H170 V690 H285 V645" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="260" y="730" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle"><tspan x="260" dy="0">T08: AGAIN / HARD /</tspan></text><text x="260" y="755" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle"><tspan x="260" dy="0">GOOD [r+1 &lt; m], m&gt;0</tspan></text><path d="M640 800 V935" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="660" y="846" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start"><tspan x="660" dy="0">T10: сброс прогресса /</tspan></text><text x="660" y="875" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start"><tspan x="660" dy="0">удаление карточки / пользователя</tspan></text><circle cx="640" cy="950" r="15" fill="white" stroke="#0f172a" stroke-width="2" /><circle cx="640" cy="950" r="10" fill="#0f172a" /><text x="640" y="1007" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle"><tspan x="640" dy="0">Условия и действия T01…T10 раскрыты в таблице жизненного цикла.</tspan></text></svg>