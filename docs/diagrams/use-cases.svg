<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060"><title>TrafficMaster — UML use case</title><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker></defs><text x="550" y="40" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle"><tspan x="550" dy="0">TrafficMaster: варианты использования</tspan></text><rect x="340" y="75" width="710" height="940" rx="0" fill="#ffffff" stroke="#334155" stroke-width="2" /><text x="695" y="110" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle"><tspan x="695" dy="0">Граница системы: REST API</tspan></text><circle cx="120" cy="180" r="16" fill="white" stroke="#334155" stroke-width="2" /><path d="M120 196 V248 M90 215 H150 M120 248 L95 282 M120 248 L145 282" fill="none" stroke="#334155" stroke-width="2" /><text x="120" y="312" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="120" dy="0">Гость</tspan></text><circle cx="120" cy="580" r="16" fill="white" stroke="#334155" stroke-width="2" /><path d="M120 596 V648 M90 615 H150 M120 648 L95 682 M120 648 L145 682" fill="none" stroke="#334155" stroke-width="2" /><text x="120" y="712" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="120" dy="0">Пользователь</tspan></text><ellipse cx="700" cy="180" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="186" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-01 · Зарегистрироваться и войти</tspan></text><path d="M150 615 L395 300" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="300" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="306" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-02 · Подготовить учебный материал</tspan></text><path d="M150 615 L395 420" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="420" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="426" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-03 · Изменить / удалить материал</tspan></text><path d="M150 615 L395 540" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="540" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="546" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-04 · Найти и скопировать колоду</tspan></text><path d="M150 615 L395 660" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="660" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="666" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-05 · Повторять карточки</tspan></text><path d="M150 615 L395 780" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="780" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="786" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-06 · Просмотреть / сбросить прогресс</tspan></text><path d="M150 615 L395 900" fill="none" stroke="#334155" stroke-width="2" /><ellipse cx="700" cy="900" rx="305" ry="42" fill="#eff6ff" stroke="#334155" stroke-width="2" /><text x="700" y="906" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="700" dy="0">UR-07 · Завершить доступ</tspan></text><path d="M150 215 L395 180" fill="none" stroke="#334155" stroke-