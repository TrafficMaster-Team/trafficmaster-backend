site_name: TrafficMaster Documentation
site_description: Documentation for the TrafficMaster backend.
site_author: TrafficMaster Team
site_url: https://trafficmaster-team.github.io/trafficmaster-backend/

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

repo_url: https://github.com/TrafficMaster-Team/trafficmaster-backend
repo_name: TrafficMaster-Team/trafficmaster-backend

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/backend/overview.md
      - Clean Architecture: architecture/backend/clean-architecture.md
      - Dependency Injection: architecture/backend/dependency-injection.md
  - API Reference:
      - Endpoints: api-reference/endpoints.md
      - Data Models: api-reference/data-models.md
  - Development:
      - Backend: development/backend.md
      - Testing: development/testing.md
      - Production: production.md
  - Contributing: contributing.md
  - Лабораторная работа № 1:
      - Требования: requirements.md
      - Верификация: verification.md
      - Жизненный цикл: card-progress-lifecycle.md
      - Первоначальный аудит: lab1-audit.md
  - Лабораторная работа № 2: lab2-verification.md
  - Лабораторная работа № 3:
      - План тестирования: lab3/test-plan.md
      - Чек-лист: lab3/checklist.md
      - Тест-кейсы: lab3/test-cases.md
      - Выполнение и метрики: lab3/execution.md
plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - attr_list
  - def_list
  - smarty
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
