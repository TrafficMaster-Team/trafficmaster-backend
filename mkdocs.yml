site_name: TrafficMaster Documentation
site_description: Documentation for the TrafficMaster backend.
site_author: TrafficMaster Team
site_url: https://trafficmaster-team.github.io/trafficmaster-backend/

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

repo_url: https://github.com/TrafficMaster-Team/trafficmaster-backend
repo_name: TrafficMaster-Team/trafficmaster-backend

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/backend/overview.md
      - Clean Architecture: architecture/backend/clean-architecture.md
      - Dependency Injection: architecture/backend/dependency-injection.md
  - API Reference:
      - Endpoints: api-reference/endpoints.md
      - Data Models: api-reference/data-models.md
  - Development:
      - Backend: development/backend.md
      - Testing: development/testing.md
      - Production: production.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - attr_list
  - def_list
  - smarty
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
